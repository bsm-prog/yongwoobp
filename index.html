<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이용우 의원 의정지원</title>
<style>
:root{--pri:#1B3A5C;--sec:#2E75B6;--acc:#4472C4;--lbg:#E8EFF7;--lbg2:#F2F7FC;--dk:#1A1A1A;--gr:#666;--wh:#fff;--bd:#D0D8E0;--green:#0F6E56;--green-bg:#E1F5EE;--amber:#854F0B;--amber-bg:#FAEEDA;--red:#A32D2D;--red-bg:#FCEBEB;--purple:#534AB7;--purple-bg:#EEEDFE}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Malgun Gothic','맑은 고딕','Segoe UI',sans-serif;background:#F4F6F8;color:var(--dk);line-height:1.6}
.top-bar{background:var(--pri);color:var(--wh);padding:0 32px;height:48px;display:flex;align-items:center;justify-content:space-between}
.top-bar h1{font-size:15px;font-weight:500;letter-spacing:.5px}
.top-bar .period{font-size:11px;opacity:0.6;font-weight:400;margin-left:12px}
.top-right{display:flex;align-items:center;gap:12px}
.edit-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--wh);cursor:pointer}
.edit-toggle input{display:none}
.toggle-track{width:36px;height:20px;background:rgba(255,255,255,.3);border-radius:10px;position:relative;transition:.3s}
.toggle-track::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;background:var(--wh);border-radius:50%;transition:.3s}
.edit-toggle input:checked+.toggle-track{background:#4CAF50}
.edit-toggle input:checked+.toggle-track::after{left:18px}
.reset-btn{background:rgba(255,255,255,.15);color:var(--wh);border:1px solid rgba(255,255,255,.3);padding:3px 10px;border-radius:5px;font-size:11px;cursor:pointer;display:none}
.reset-btn:hover{background:rgba(255,255,255,.25)}
body.edit-mode .reset-btn{display:inline-block}
.header{background:var(--wh);border-bottom:1px solid var(--bd);padding:20px 32px;display:flex;align-items:center;gap:16px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--sec);color:var(--wh);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.header-info h2{font-size:20px;font-weight:600;color:var(--pri)}
.header-info .header-sub{font-size:13px;color:var(--gr);margin-top:2px}
.header-info .header-msg{font-size:12px;color:var(--sec);margin-top:4px;font-weight:400}
.tabs{background:var(--wh);border-bottom:2px solid #E0E4E8;padding:0 32px;display:flex;gap:0;overflow-x:auto}
.tab{padding:12px 18px;font-size:13px;font-weight:500;color:var(--gr);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s;letter-spacing:.3px}
.tab:hover{color:var(--sec)}
.tab.active{color:var(--sec);border-bottom-color:var(--sec);font-weight:600}
.content{max-width:960px;margin:0 auto;padding:24px 32px}
.panel{display:none}
.panel.active{display:block}
.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.metric{background:var(--wh);border-radius:10px;padding:14px 18px;border:1px solid var(--bd)}
.metric-label{font-size:11px;color:var(--gr);margin-bottom:4px}
.metric-val{font-size:22px;font-weight:700;color:var(--pri)}
.metric-val span{font-size:13px;font-weight:400;color:var(--gr)}
.card{background:var(--wh);border-radius:10px;border:1px solid var(--bd);padding:20px;margin-bottom:12px;position:relative;transition:border-color .2s}
.card-title{font-size:14px;font-weight:600;color:var(--pri);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-body{font-size:13px;color:#444;line-height:1.7}
.section-title{font-size:16px;font-weight:600;color:var(--pri);margin:24px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--sec)}
.section-title:first-child{margin-top:0}
.sub-title{font-size:14px;font-weight:600;color:var(--sec);margin:16px 0 8px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;cursor:pointer;user-select:none;transition:all .15s;flex-shrink:0}
.badge-plan{background:#E8EFF7;color:var(--acc)}
.badge-prog{background:var(--amber-bg);color:var(--amber)}
.badge-done{background:var(--green-bg);color:var(--green)}
.badge:hover{transform:scale(1.05);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.tbl th{background:var(--pri);color:var(--wh);padding:10px 12px;text-align:left;font-weight:500;font-size:12px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd)}
.tbl tr:nth-child(even){background:var(--lbg2)}
.tbl tr:hover{background:var(--lbg)}
.tbl .divider-row td{background:var(--lbg);text-align:center;font-weight:600;color:var(--sec);padding:8px}
ul.bl{list-style:none;padding-left:0;margin:4px 0}
ul.bl li{padding:3px 0 3px 18px;position:relative;font-size:13px;color:#444}
ul.bl li::before{content:'';position:absolute;left:0;width:6px;height:6px;background:var(--acc);border-radius:50%;top:10px}
.prof-tbl{width:100%;border-collapse:collapse;margin-top:8px}
.prof-tbl th{background:var(--pri);color:var(--wh);padding:10px 14px;text-align:center;font-weight:500;width:130px;font-size:12px}
.prof-tbl td{padding:10px 14px;border:1px solid var(--bd);font-size:13px}
.prog-bar{height:14px;background:#E0E4E8;border-radius:7px;overflow:hidden;margin:8px 0 4px}
.prog-fill{height:100%;background:var(--sec);border-radius:7px;transition:width .5s}
.prog-text{font-size:12px;color:var(--gr)}
.next-alert{background:linear-gradient(135deg,var(--lbg),var(--lbg2));border:1px solid var(--acc);border-radius:10px;padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;border-left:4px solid var(--sec)}
.next-alert .text{font-size:13px;color:var(--pri)}
.next-alert .text strong{color:var(--sec)}
/* Edit mode */
.grip{display:none;color:var(--gr);cursor:grab;font-size:18px;padding:0 4px;flex-shrink:0;user-select:none}
.grip:active{cursor:grabbing}
body.edit-mode .grip{display:inline-block}
.del-btn{display:none;position:absolute;top:8px;right:8px;background:var(--red-bg);color:var(--red);border:none;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;line-height:28px;text-align:center}
.del-btn:hover{background:var(--red);color:var(--wh)}
body.edit-mode .del-btn{display:block}
.add-btn{display:none;border:2px dashed var(--acc);background:transparent;color:var(--acc);padding:12px;border-radius:10px;width:100%;cursor:pointer;font-size:13px;font-weight:600;margin:8px 0 16px;transition:all .2s}
.add-btn:hover{background:var(--lbg);border-color:var(--sec)}
body.edit-mode .add-btn{display:block}
body.edit-mode .card{cursor:default}
body.edit-mode .card.dragging{opacity:.4;border:2px dashed var(--acc)}
body.edit-mode .card.drag-over{border-top:3px solid var(--sec)}
[contenteditable=true]{outline:none;border-bottom:1px dashed var(--acc);padding:0 2px;min-width:20px}
[contenteditable=true]:focus{background:var(--lbg2);border-bottom-color:var(--sec)}
body.edit-mode .tbl td[contenteditable]{border-bottom:1px dashed var(--acc)}
.tbl .add-row-btn{display:none;background:transparent;border:2px dashed var(--acc);color:var(--acc);padding:8px;width:100%;cursor:pointer;font-size:12px;font-weight:600}
body.edit-mode .tbl .add-row-btn{display:block}
.tbl .del-cell{display:none;color:var(--red);cursor:pointer;font-size:14px;text-align:center}
body.edit-mode .tbl .del-cell{display:table-cell}
.tbl .grip-cell{display:none;cursor:grab;color:var(--gr);font-size:14px;text-align:center}
body.edit-mode .tbl .grip-cell{display:table-cell}
/* Calendar */
.cal-wrap{margin-bottom:24px}
.cal-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.cal-nav button{background:var(--wh);border:1px solid var(--bd);border-radius:6px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--pri);display:flex;align-items:center;justify-content:center}
.cal-nav button:hover{background:var(--lbg)}
.cal-nav .cal-month{font-size:16px;font-weight:600;color:var(--pri);min-width:120px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--wh)}
.cal-hdr{background:var(--pri);color:var(--wh);text-align:center;font-size:12px;font-weight:500;padding:8px 4px}
.cal-hdr.sun{color:#FFA8A8}.cal-hdr.sat{color:#A8D1FF}
.cal-cell{min-height:80px;border:1px solid #EEE;padding:4px;vertical-align:top;position:relative;font-size:12px}
.cal-cell.other{background:#FAFAFA;color:#CCC}
.cal-cell.today{background:#FFFDE7}
.cal-day{font-weight:600;margin-bottom:2px;font-size:12px;color:var(--dk)}
.cal-cell.other .cal-day{color:#CCC}
.cal-cell.sun .cal-day{color:#E53935}
.cal-cell.sat .cal-day{color:var(--sec)}
.cal-evt{display:block;background:var(--sec);color:var(--wh);font-size:10px;padding:1px 4px;border-radius:3px;margin-bottom:2px;overflow:hidden;cursor:default;line-height:1.4;word-break:break-all}
.cal-evt.st0{background:var(--acc)}.cal-evt.st1{background:#D4A017}.cal-evt.st2{background:var(--green)}
.cal-evt:hover{opacity:.85}
.cal-more{font-size:10px;color:var(--sec);cursor:pointer;font-weight:500}
.cal-legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:11px;color:var(--gr)}
.cal-legend span{display:flex;align-items:center;gap:4px}
.cal-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.cal-cell.in-session{background:#EBF3FB!important}
.cal-evt.ple{background:#1B3A5C}.cal-evt.com{background:#2E75B6}.cal-evt.aud{background:#D35400}.cal-evt.bud{background:#8E44AD}
.cal-evt.prS{background:#009688;opacity:.8}.cal-evt.prB{background:#E67E22;opacity:.8}.cal-evt.prQ{background:#3F51B5;opacity:.8}.cal-evt.prA{background:#C0392B;opacity:.8}.cal-evt.prU{background:#9B59B6;opacity:.8}
.cal-evt.hol{background:#E53935;opacity:.7}
.cal-evt.cat-research{background:#00897B}.cal-evt.cat-pledge{background:#F57C00}.cal-evt.cat-activity{background:#5C6BC0}
.cal-bar{height:3px;border-radius:1px;margin:1px 0;padding:0!important}
.cal-legend2{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:4px;font-size:11px;color:var(--gr)}
.cal-legend2 span{display:flex;align-items:center;gap:4px}
.cal-legend2 i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* Pledge accordion */
.pledge-view-toggle{display:flex;gap:0;margin-bottom:16px}
.pledge-view-btn{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--wh);color:var(--gr);transition:all .2s}
.pledge-view-btn:first-child{border-radius:8px 0 0 8px}
.pledge-view-btn:last-child{border-radius:0 8px 8px 0}
.pledge-view-btn.active{background:var(--pri);color:var(--wh);border-color:var(--pri)}
.acc-group{margin-bottom:8px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--wh)}
.acc-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background .2s}
.acc-header:hover{background:var(--lbg2)}
.acc-header .acc-left{display:flex;align-items:center;gap:8px}
.acc-header .acc-icon{font-size:18px}
.acc-header .acc-name{font-size:14px;font-weight:600;color:var(--pri)}
.acc-header .acc-cnt{font-size:12px;color:var(--gr)}
.acc-header .acc-right{display:flex;align-items:center;gap:8px}
.acc-header .acc-ratio{font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px}
.acc-header .acc-arrow{font-size:14px;color:var(--gr);transition:transform .2s}
.acc-body{display:none;border-top:1px solid var(--bd);padding:8px 16px}
.acc-group.open .acc-body{display:block}
.acc-group.open .acc-arrow{transform:rotate(180deg)}
.acc-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid #F0F0F0}
.acc-item:last-child{border-bottom:none}
.acc-item .acc-st{width:18px;height:18px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s}
.acc-item .acc-st:hover{transform:scale(1.1)}
.acc-item .acc-st.s0{border-color:var(--acc);color:transparent}
.acc-item .acc-st.s1{border-color:var(--amber);background:var(--amber-bg);color:var(--amber)}
.acc-item .acc-st.s2{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.pledge-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.sync-ind{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.7);cursor:pointer}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sync-dot.synced{background:#4CAF50}.sync-dot.syncing{background:#FFC107;animation:pulse .8s infinite}.sync-dot.error{background:#F44336}.sync-dot.offline{background:#999}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.small-del{margin-left:auto;color:var(--red);cursor:pointer;font-size:12px;flex-shrink:0;display:none}
body.edit-mode .small-del{display:inline-block}
/* Research Links */
.res-links{margin-top:10px;border-top:1px dashed var(--bd);padding-top:8px}
.res-links-title{font-size:11px;color:var(--gr);font-weight:600;margin-bottom:6px}
.res-link-item{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.res-link-item a{font-size:12px;color:var(--sec);text-decoration:none;word-break:break-all;flex:1}
.res-link-item a:hover{text-decoration:underline}
.res-link-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:11px;padding:2px 4px;border-radius:4px}
.res-link-del:hover{background:var(--red-bg)}
.res-link-add{background:transparent;border:1px dashed var(--sec);color:var(--sec);padding:3px 10px;border-radius:6px;cursor:pointer;font-size:11px;margin-top:4px}
.res-link-add:hover{background:var(--lbg)}
/* Policy tasks grid */
.policy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.policy-item{background:var(--wh);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;display:flex;align-items:flex-start;gap:8px}
.policy-item .pid{font-size:10px;font-weight:700;color:var(--wh);background:var(--sec);border-radius:4px;padding:1px 6px;flex-shrink:0;margin-top:2px}
.policy-item .ptitle{font-size:13px;font-weight:500;color:var(--pri);line-height:1.4}
.policy-item .pdesc{font-size:11px;color:var(--gr);margin-top:2px}
/* Issue card */
.issue-field{margin-top:8px}
.issue-field-label{font-size:11px;font-weight:600;color:var(--sec);margin-bottom:2px}
.issue-field-val{font-size:13px;color:#444;padding:4px 0;min-height:20px}
/* Result type badge */
.result-type{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;color:var(--wh)}
/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--gr);font-size:14px}
.sns-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.sns-card{display:flex;flex-direction:column;align-items:center;padding:24px 16px;border-radius:12px;text-decoration:none;color:var(--wh);transition:transform .2s,box-shadow .2s}
.sns-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.sns-insta{background:linear-gradient(135deg,#833AB4,#FD1D1D,#F77737)}
.sns-fb{background:#1877F2}
.sns-web{background:var(--pri)}
.sns-icon{margin-bottom:10px}
.sns-name{font-size:15px;font-weight:600;margin-bottom:2px}
.sns-handle{font-size:12px;opacity:.85}
/* Philosophy quote */
.philosophy{background:var(--lbg2);border-left:3px solid var(--sec);padding:16px 20px;margin:12px 0 20px;border-radius:0 8px 8px 0}
.philosophy .main-q{font-size:15px;font-weight:500;color:var(--pri);line-height:1.6}
.philosophy .sub-q{font-size:13px;color:var(--gr);margin-top:8px}
@media(max-width:768px){.metric-row{grid-template-columns:repeat(2,1fr)}.content{padding:16px}.tabs{padding:0 16px}.header{padding:16px}.cal-cell{min-height:60px}.pledge-layout{grid-template-columns:1fr}.policy-grid{grid-template-columns:1fr}.top-bar{padding:0 16px}.sns-cards{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="top-bar">
  <h1>이용우 의원 의정지원<span class="period">2026.7 ~ 2028.6</span></h1>
  <div class="top-right">
    <div class="sync-ind" id="syncInd" onclick="setupToken()" title="클릭하여 토큰 설정"><span class="sync-dot offline" id="syncDot"></span><span id="syncTxt">오프라인</span></div>
    <button class="reset-btn" onclick="resetAll()">초기화</button>
    <label class="edit-toggle"><input type="checkbox" id="editToggle" onchange="toggleEditMode()"><span class="toggle-track"></span>편집</label>
  </div>
</div>

<div class="header">
  <div class="avatar"><img src="photo.png" alt="이용우" onerror="this.remove();this.parentNode.textContent='이'"></div>
  <div class="header-info">
    <h2>이용우 의원</h2>
    <p class="header-sub">더불어민주당 · 부평구라선거구(청천1·2동, 산곡1·2동) · 행정복지위원회</p>
    <p class="header-msg">주민과 함께 만들어온 경험을 제도와 정책으로 연결하는 생활정치</p>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab(0)">의정현황</div>
  <div class="tab" onclick="showTab(1)">보도자료</div>
  <div class="tab" onclick="showTab(2)">프로필</div>
  <div class="tab" onclick="showTab(3)">공약이행</div>
  <div class="tab" onclick="showTab(4)">의정활동</div>
  <div class="tab" onclick="showTab(5)">조사·분석</div>
  <div class="tab" onclick="showTab(6)">일정표</div>
  <div class="tab" onclick="showTab(7)">지역현안</div>
  <div class="tab" onclick="showTab(8)">성과</div>
</div>

<div class="content">
  <div class="panel active" id="panel-0"></div>
  <div class="panel" id="panel-1"></div>
  <div class="panel" id="panel-2"></div>
  <div class="panel" id="panel-3"></div>
  <div class="panel" id="panel-4"></div>
  <div class="panel" id="panel-5"></div>
  <div class="panel" id="panel-6"></div>
  <div class="panel" id="panel-7"></div>
  <div class="panel" id="panel-8"></div>
</div>

<script>
/* ===== CONFIG ===== */
const STORAGE='lee_yw_v2';
const GIST_ID='';
const GIST_FILE='lee_yw_data.json';
const TOKEN_KEY='gist_token';
let syncTimer=null;
function getToken(){return localStorage.getItem(TOKEN_KEY)}
function setupToken(){const t=prompt('GitHub Personal Access Token을 입력해주세요.\n(기기당 최초 1회만 입력하면 됩니다)\n\n현재 상태: '+(getToken()?'토큰 있음':'토큰 없음'));if(t&&t.trim()){localStorage.setItem(TOKEN_KEY,t.trim());pullFromGist()}else if(t===''){localStorage.removeItem(TOKEN_KEY);setSyncStatus('offline','오프라인')}}
function setSyncStatus(s,t){const d=document.getElementById('syncDot'),x=document.getElementById('syncTxt');if(!d)return;d.className='sync-dot '+s;x.textContent=t}
async function pushToGist(){const token=getToken();if(!token||!GIST_ID){setSyncStatus('offline',GIST_ID?'토큰 없음':'Gist 미설정');return}
  setSyncStatus('syncing','저장 중...');
  try{const body={};body[GIST_FILE]={content:JSON.stringify({...data,_ts:Date.now()})};
    const r=await fetch('https://api.github.com/gists/'+GIST_ID,{method:'PATCH',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({files:body})});
    if(r.ok){setSyncStatus('synced','동기화됨')}else{setSyncStatus('error','동기화 실패')}
  }catch(e){setSyncStatus('error','연결 오류')}}
function debouncedPush(){clearTimeout(syncTimer);syncTimer=setTimeout(pushToGist,800)}
async function pullFromGist(){const token=getToken();if(!token||!GIST_ID){setSyncStatus('offline',GIST_ID?'토큰 없음':'Gist 미설정');return}
  setSyncStatus('syncing','불러오는 중...');
  try{const r=await fetch('https://api.github.com/gists/'+GIST_ID,{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok){setSyncStatus('error','불러오기 실패');return}
    const g=await r.json();const f=g.files[GIST_FILE];
    if(!f||f.content==='{"_ts":0}'){setSyncStatus('synced','동기화됨');if(data)debouncedPush();return}
    const remote=JSON.parse(f.content);const localTs=data._ts||0;const remoteTs=remote._ts||0;
    if(remoteTs>localTs){delete remote._ts;data=remote;migrateData();
      localStorage.setItem(STORAGE,JSON.stringify(data));renderAll();setSyncStatus('synced','클라우드에서 불러옴')}
    else{setSyncStatus('synced','동기화됨');if(localTs>0&&remoteTs<localTs)debouncedPush()}
  }catch(e){setSyncStatus('error','연결 오류')}}

/* ===== DATA MANAGEMENT ===== */
let data;
function migrateData(){
  if(!data.elecField) data.elecField=Array(16).fill(0);
  if(!data.elecTarget) data.elecTarget=Array(12).fill(0);
  if(!data.issues) data.issues=JSON.parse(JSON.stringify(DEFAULT.issues));
  if(!data.results) data.results=[];
  if(!data.media) data.media=[];
  data.activities.forEach(a=>{
    if(typeof a.body==='string'){const sep=a.body.includes('|')?'|':'\n';a.tasks=a.body.split(sep).filter(s=>s.trim()).map(t=>({text:t.trim(),status:0}));delete a.body}
    if(!a.tasks) a.tasks=[];
    if(typeof a.details==='string'){a.preps=a.details.split('|').filter(s=>s.trim()).map(t=>({text:t.trim(),status:0}));delete a.details}
    if(!a.preps) a.preps=[];
  });
  data.pledges.forEach(pl=>{
    if(typeof pl.body==='string'){pl.tasks=pl.body.split('|').filter(Boolean).map(t=>({text:t,status:0}));delete pl.body}
    if(!pl.tasks) pl.tasks=[];
  });
  if(!data.research) data.research=[];
  data.research.forEach(r=>{if(!r.tasks)r.tasks=[];if(!r.links)r.links=[]});
}
function loadData(){
  try{const s=localStorage.getItem(STORAGE);data=s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT))}
  catch(e){data=JSON.parse(JSON.stringify(DEFAULT))}
  migrateData();
}
function saveData(){data._ts=Date.now();localStorage.setItem(STORAGE,JSON.stringify(data));debouncedPush()}
function resetAll(){if(confirm('모든 편집 내용을 초기 상태로 되돌리시겠습니까?')){localStorage.removeItem(STORAGE);loadData();renderAll()}}

let nextId=1000;
function genId(){return 'n'+(nextId++)}

/* ===== TAB / EDIT ===== */
function showTab(n){document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('active',i===n))}
function toggleEditMode(){editMode=document.getElementById('editToggle').checked;document.body.classList.toggle('edit-mode',editMode);renderAll()}

/* ===== STATUS ===== */
function cycleStatus(arr,idx){arr[idx].status=(arr[idx].status+1)%3;saveData();renderAll()}
function cycleElec(type,idx){if(type==='field'){data.elecField[idx]=(data.elecField[idx]+1)%3}else{data.elecTarget[idx]=(data.elecTarget[idx]+1)%3};saveData();renderAll()}

/* ===== DRAG & DROP (cards) ===== */
let dragSrc=null,dragArr=null;
function dragStart(e,arr,idx){dragSrc=idx;dragArr=arr;e.target.closest('.card').classList.add('dragging')}
function dragEnd(e){document.querySelectorAll('.card').forEach(c=>{c.classList.remove('dragging','drag-over')})}
function dragOver(e){e.preventDefault();e.target.closest('.card')?.classList.add('drag-over')}
function dragLeave(e){e.target.closest('.card')?.classList.remove('drag-over')}
function drop(e,arr,idx){e.preventDefault();if(dragArr!==arr||dragSrc===idx)return;const item=arr.splice(dragSrc,1)[0];arr.splice(idx,0,item);saveData();renderAll()}
let dragRowSrc=null;
function rowDragStart(e,idx){dragRowSrc=idx;e.target.closest('tr').style.opacity='.4'}
function rowDragEnd(e){e.target.closest('tr').style.opacity='1'}
function rowDragOver(e){e.preventDefault()}
function rowDrop(e,idx){e.preventDefault();if(dragRowSrc===null||dragRowSrc===idx)return;const item=data.schedule.splice(dragRowSrc,1)[0];data.schedule.splice(idx,0,item);dragRowSrc=null;saveData();renderAll()}

function makeEditable(text,onSave){const el=document.createElement('span');el.textContent=text;if(editMode){el.contentEditable='true';el.addEventListener('blur',()=>{onSave(el.textContent.trim());saveData()})}return el}

/* ===== RENDER HELPERS ===== */
function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function parseDateOrder(dateStr){if(!dateStr)return 99999999;const m=dateStr.match(/(\d{4})\.\s*(\d{1,2})/);if(!m)return 99999999;const y=parseInt(m[1]),mo=parseInt(m[2]);const dm=dateStr.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);const d=dm?parseInt(dm[3]):1;return y*10000+mo*100+d}
function sortByDate(arr){return [...arr].sort((a,b)=>parseDateOrder(a.date)-parseDateOrder(b.date))}
function elecStats(){let fd=0,ft=0;data.elecField.forEach(s=>{ft++;if(s===2)fd++});let ad=0,at=0;data.elecTarget.forEach(s=>{at++;if(s===2)ad++});return{fd,ft,ad,at,td:fd+ad,tt:ft+at}}

/* ===== RENDER: PLEDGES (공약이행) ===== */
let openAccIdx={};
function toggleAcc(key){openAccIdx[key]=!openAccIdx[key];renderPledges()}

function renderElecAccordion(groups,stateArr,type){
  let html='',gi=0;
  groups.forEach(g=>{
    const startIdx=gi;
    const done=g.items.reduce((s,_,i)=>s+(stateArr[startIdx+i]===2?1:0),0);
    const prog=g.items.reduce((s,_,i)=>s+(stateArr[startIdx+i]===1?1:0),0);
    const total=g.items.length;
    const key=type+'_'+g.cat;
    const isOpen=openAccIdx[key];
    const ratioStyle=done===total?'background:var(--green-bg);color:var(--green)':prog>0?'background:var(--amber-bg);color:var(--amber)':'background:var(--lbg);color:var(--acc)';
    html+=`<div class="acc-group ${isOpen?'open':''}">
      <div class="acc-header" onclick="toggleAcc('${key}')">
        <div class="acc-left"><span class="acc-name">${escHtml(g.cat)}</span><span class="acc-cnt">${total}개</span></div>
        <div class="acc-right"><span class="acc-ratio" style="${ratioStyle}">${done}/${total}</span><span class="acc-arrow">V</span></div>
      </div><div class="acc-body">`;
    g.items.forEach((item,i)=>{
      const idx=startIdx+i;const st=stateArr[idx];const stIcon=st===2?'V':st===1?'*':'';
      html+=`<div class="acc-item"><div class="acc-st s${st}" onclick="cycleElec('${type}',${idx})">${stIcon}</div><span style="${st===2?'text-decoration:line-through;color:var(--gr)':''}">${escHtml(item)}</span></div>`;
    });
    html+=`</div></div>`;gi+=g.items.length;
  });
  return html;
}

function renderCalendar(){
  const first=new Date(calYear,calMonth-1,1);const startDow=first.getDay();const dim=new Date(calYear,calMonth,0).getDate();const prevDays=new Date(calYear,calMonth-1,0).getDate();
  const today=new Date();const tY=today.getFullYear(),tM=today.getMonth()+1,tD=today.getDate();
  const mStart=ymd(calYear,calMonth,1),mEnd=ymd(calYear,calMonth,dim);
  const evts={};const add=(d,text,cls,pri)=>{if(!evts[d])evts[d]=[];evts[d].push({text,cls,pri:pri||5})};
  OVERLAY.forEach(([s,e,label,cls,pri])=>{if(e<mStart||s>mEnd)return;const ds=s<mStart?1:(s%100),de=e>mEnd?dim:((Math.floor(e/100)%100===calMonth)?e%100:dim);for(let d=ds;d<=de;d++) add(d,d===ds?label:'',cls,pri)});
  sortByDate(data.schedule.filter(s=>s.cat!=='__divider__')).forEach(s=>{const pd=parseSchedDate(s.date);if(!pd||pd.y!==calYear||pd.m!==calMonth)return;
    var evCls='st'+s.status;if(s.cat&&s.cat.indexOf('조사')>=0)evCls='cat-research';else if(s.cat&&s.cat.indexOf('공약')>=0)evCls='cat-pledge';else if(s.cat&&s.cat.indexOf('의정')>=0||s.cat&&s.cat.indexOf('활동')>=0)evCls='cat-activity';
    add(pd.d||1,s.text||s.cat,evCls,5)});
  function inSess(d){const dn=ymd(calYear,calMonth,d);return SESS.some(([s,e])=>dn>=s&&dn<=e)}
  let html='<div class="cal-wrap"><div class="cal-nav"><button onclick="calPrev()"><</button><span class="cal-month">'+calYear+'년 '+calMonth+'월</span><button onclick="calNext()">></button></div><div class="cal-grid">';
  ['일','월','화','수','목','금','토'].forEach((dn,di)=>html+=`<div class="cal-hdr${di===0?' sun':''}${di===6?' sat':''}">${dn}</div>`);
  for(let i=startDow-1;i>=0;i--) html+=`<div class="cal-cell other"><div class="cal-day">${prevDays-i}</div></div>`;
  for(let d=1;d<=dim;d++){const dow=(startDow+d-1)%7;let cls='cal-cell';if(calYear===tY&&calMonth===tM&&d===tD)cls+=' today';if(dow===0)cls+=' sun';if(dow===6)cls+=' sat';if(inSess(d))cls+=' in-session';html+=`<div class="${cls}"><div class="cal-day">${d}</div>`;if(evts[d]){const sorted=evts[d].sort((a,b)=>a.pri-b.pri);sorted.slice(0,4).forEach(ev=>{if(ev.text)html+=`<div class="cal-evt ${ev.cls}" title="${escHtml(ev.text)}">${escHtml(ev.text)}</div>`;else html+=`<div class="cal-evt ${ev.cls} cal-bar"></div>`});if(sorted.length>4)html+=`<div class="cal-more">+${sorted.length-4}</div>`}html+='</div>'}
  const total=startDow+dim,remain=total%7===0?0:7-total%7;for(let i=1;i<=remain;i++)html+=`<div class="cal-cell other"><div class="cal-day">${i}</div></div>`;
  html+='</div>';
  html+=`<div class="cal-legend"><span><i style="background:#1B3A5C"></i>본회의</span><span><i style="background:#2E75B6"></i>상임위</span><span><i style="background:#D35400"></i>감사</span><span><i style="background:#8E44AD"></i>예결위</span><span><i style="background:#E53935"></i>공휴일</span></div>`;
  html+=`<div class="cal-legend2"><span><i style="background:#3F51B5"></i>질문준비</span><span><i style="background:#C0392B"></i>감사준비</span><span><i style="background:#9B59B6"></i>예산준비</span></div>`;
  html+='</div>';return html;
}
